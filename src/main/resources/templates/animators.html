<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Команда Аніматорів</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 30px; max-width: 900px; margin: 0 auto; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #0984e3; font-size: 2.5em; margin: 0; }
        .btn { background-color: #4ecdc4; color: white; padding: 12px 25px; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 10px; transition: 0.3s; }
        .btn:hover { background-color: #45b7aa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .animator-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border-bottom: 5px solid #0984e3; }
        .animator-name { font-size: 24px; color: #2d3436; margin-bottom: 5px; }
        .animator-role { color: #636e72; font-size: 18px; margin-bottom: 15px; }
        .status-pro { color: #fff; background-color: #d63031; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .status-new { color: #fff; background-color: #00b894; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .notes { margin-top: 15px; padding: 10px; background: #f1f2f6; border-radius: 8px; font-style: italic; color: #2f3640; }
    </style>
</head>
<body>
<div class="header">
    <h1>🦸 Наша крута команда!</h1>
    <a th:href="@{/}" class="btn">← Назад до програм</a>
</div>

<div class="grid">
    <div class="animator-card" th:each="animator : ${animators}">
        <h2 class="animator-name" th:text="${animator.name}">Ім'я</h2>
        <div class="animator-role">Роль: <span th:text="${animator.role}"></span></div>

        <span th:if="${animator.experience >= 2}" class="status-pro">🔥 Досвідчений профі</span>
        <span th:unless="${animator.experience >= 2}" class="status-new">🌱 Молодий талант</span>

        <div class="notes" th:text="${animator.notes ?: 'Без коментарів'}"></div>
    </div>
</div>
</body>
</html>
