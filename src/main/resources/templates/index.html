<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Програми Krutishe_Za_Vsih</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #ff6b6b; text-align: center; font-size: 2.5em; margin-top: 30px; }
        .btn { display: inline-block; background-color: #4ecdc4; color: white; padding: 12px 25px; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover { background-color: #45b7aa; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .btn-outline { background-color: transparent; border: 2px solid #ff6b6b; color: #ff6b6b; }
        .btn-outline:hover { background-color: #ff6b6b; color: white; }
        .programs-grid { display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: white; border-left: 8px solid #ffe66d; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: scale(1.02); }
        .card h2 { margin: 0 0 10px 0; color: #2c3e50; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
<div class="header">
    <a th:href="@{/animators}" class="btn btn-outline">🎭 Наша команда</a>
    <div>
        <!-- Меню авторизації -->
        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn">🔐 Вхід для команди</a>
        <span sec:authorize="isAuthenticated()" style="font-size: 18px; font-weight: bold;">
                Привіт, <span sec:authentication="name" style="color: #ff6b6b;"></span>!
                <a th:href="@{/reports}" class="btn" style="margin-left: 15px;">💼 Мій кабінет</a>
            </span>
    </div>
</div>

<h1>🎉 Розважальні програми</h1>

<div class="programs-grid">
    <!-- Цикл each -->
    <div class="card" th:each="program : ${programs}">
        <h2 th:text="${program.name}">Назва</h2>

        <p th:text="${program.description ?: 'Опис для цієї програми ще не додано.'}" style="font-size: 18px; color: #555;"></p>

        <!-- switch/case з красивими бейджиками -->
        <div th:switch="${program.category}">
            <span th:case="'VIP'" class="badge" style="background-color: #ffd700; color: #000;">⭐ VIP Програма</span>
            <span th:case="'QUEST'" class="badge" style="background-color: #9b59b6; color: #fff;">🗺️ Квест</span>
            <span th:case="'Standard'" class="badge" style="background-color: #2ecc71; color: #fff;">🎈 Стандартна анімація</span>
            <span th:case="*" class="badge" style="background-color: #bdc3c7; color: #fff;">Категорія не визначена</span>
        </div>
    </div>
</div>
</body>
</html>
