<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Кабінет Аніматора</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2d3436; color: #dfe6e9; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .dashboard { background: #353b48; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #fbc531; font-size: 2.5em; margin-top: 0; }
        .info-box { background: #2f3640; border: 2px dashed #718093; padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 18px; }
        .btn-danger { background-color: #e84118; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 20px; }
        .btn-danger:hover { background-color: #c23616; transform: scale(1.02); }
        .btn-home { background-color: #00a8ff; color: white; padding: 15px 30px; text-decoration: none; border-radius: 10px; font-size: 18px; font-weight: bold; display: inline-block; margin-top: 15px; width: 100%; box-sizing: border-box; }
        .btn-home:hover { background-color: #0097e6; }
    </style>
</head>
<body>
<div class="dashboard">
    <h1>💼 Внутрішній кабінет CRM</h1>

    <div class="info-box">
        Привіт, <strong sec:authentication="name" style="color: #4cd137;"></strong>! 👋<br><br>
        Сюди мають доступ лише авторизовані аніматори (ти) та адміністратор.<br>
        Тут згодом з'явиться форма для відправки звітів після проведеного свята.
    </div>

    <a th:href="@{/}" class="btn-home">🏠 Повернутися на вітрину</a>

    <!-- Кнопка виходу -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-danger">🚪 Вийти з акаунта</button>
    </form>
</div>
</body>
</html>
